# Serves the built MkDocs site. It sits behind Caddy, which strips the /docs prefix
# (handle_path /docs/*), so this server only ever sees paths relative to the site root.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # MkDocs uses directory-style URLs (TRACING/ -> TRACING/index.html). When a directory is
    # requested without a trailing slash, nginx issues a 301 to add it. `absolute_redirect off`
    # keeps that redirect relative — an absolute one would rebuild the Location without the
    # /docs prefix Caddy stripped, sending the browser to the wrong place.
    absolute_redirect off;

    # A short cache on the fingerprinted assets (their filenames change on every build), none on
    # the HTML so a redeploy is visible immediately.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
